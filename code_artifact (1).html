<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Universe - רשת תחנות הרוק שלך</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'rock-dark': '#1a1a1a',
                        'rock-red': '#e63946',
                        'rock-gray': '#457b9d',
                        'rock-light': '#f1faee',
                    },
                    fontFamily: {
                        sans: ['Heebo', 'sans-serif'],
                        rock: ['Rubik Mono One', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700&family=Rubik+Mono+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Heebo', sans-serif;
            background-color: #1a1a1a;
            color: #f1faee;
            background-image: radial-gradient(circle at 50% 50%, #2a2a2a 0%, #1a1a1a 100%);
            min-height: 100vh;
        }
        .font-rock {
            font-family: 'Rubik Mono One', sans-serif;
        }
        
        /* Custom scrollbars */
        .playlist-scroll::-webkit-scrollbar, .hide-scrollbar::-webkit-scrollbar {
            height: 6px;
            width: 8px;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none; /* Hide scrollbar for horizontal menu but keep functionality */
        }
        .playlist-scroll::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        .playlist-scroll::-webkit-scrollbar-thumb {
            background: var(--channel-color, #e63946);
            border-radius: 4px;
        }
        
        /* Animation for playing equalizer */
        .bar {
            width: 4px;
            background-color: var(--channel-color, #e63946);
            margin: 0 2px;
            display: inline-block;
            transition: height 0.1s ease, background-color 0.5s ease;
        }
        .playing .bar:nth-child(1) { animation: eq 1s infinite alternate; }
        .playing .bar:nth-child(2) { animation: eq 0.8s infinite alternate-reverse; }
        .playing .bar:nth-child(3) { animation: eq 1.2s infinite alternate; }
        .playing .bar:nth-child(4) { animation: eq 0.9s infinite alternate-reverse; }
        .playing .bar:nth-child(5) { animation: eq 1.1s infinite alternate; }

        @keyframes eq {
            0% { height: 5px; }
            50% { height: 25px; }
            100% { height: 10px; }
        }
        
        .spin {
            animation: spin 10s linear infinite;
        }
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        
        /* Shazam-like Listening Animation */
        @keyframes pulse-blue {
            0% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(37, 99, 235, 0); }
            100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
        }
        .listening-animation {
            animation: pulse-blue 1.5s infinite;
            background-color: #1d4ed8 !important;
        }

        /* Dynamic coloring variables */
        :root {
            --channel-color: #e63946;
            --channel-glow: rgba(230,57,70,0.4);
        }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <header class="bg-black bg-opacity-50 p-4 border-b border-opacity-30 shadow-lg relative z-10 transition-colors duration-500" id="main-header" style="border-color: var(--channel-color)">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fas fa-satellite-dish text-3xl transition-colors duration-500" id="header-icon" style="color: var(--channel-color)"></i>
                <h1 class="font-rock text-2xl md:text-3xl tracking-wider text-rock-light uppercase drop-shadow-md">
                    Rock <span class="transition-colors duration-500" style="color: var(--channel-color)">Universe</span>
                </h1>
            </div>
            <nav class="hidden md:flex gap-6 text-sm font-bold tracking-widest uppercase">
                <a href="#" class="hover:text-gray-300 transition-colors">אודות הרשת</a>
                <a href="#" class="hover:text-gray-300 transition-colors">לוח שידורים מלא</a>
                <a href="#" class="hover:text-gray-300 transition-colors">צור קשר</a>
            </nav>
            <button class="md:hidden text-2xl text-rock-light focus:outline-none">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </header>

    <div class="w-full bg-black bg-opacity-80 border-b border-white border-opacity-10 py-2 px-4 z-10 overflow-x-auto whitespace-nowrap hide-scrollbar shadow-md">
        <div class="container mx-auto flex gap-3 justify-start md:justify-center" id="channel-selector">
            <!-- Channel buttons will be injected here via JS -->
        </div>
    </div>

    <main class="flex-grow flex flex-col md:flex-row container mx-auto p-4 gap-6 overflow-hidden relative z-10">
        
        <!-- Player Section (Left/Top) -->
        <section class="w-full md:w-1/2 lg:w-2/3 flex flex-col items-center justify-center bg-black bg-opacity-40 rounded-2xl p-6 md:p-12 shadow-2xl border border-white border-opacity-10 backdrop-blur-sm">
            
            <div class="relative w-40 h-40 md:w-56 md:h-56 mb-6 rounded-full border-4 shadow-2xl overflow-hidden transition-all duration-500" id="album-container" style="border-color: var(--channel-color); box-shadow: 0 0 30px var(--channel-glow);">
                <img id="album-art" src="https://images.unsplash.com/photo-1511735111819-9a3f7709049c?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=60" alt="Station Art" class="w-full h-full object-cover transition-opacity duration-300">
                <div class="absolute inset-0 m-auto w-12 h-12 bg-rock-dark rounded-full border-2 border-gray-800"></div>
            </div>

            <div class="text-center w-full mb-6">
                <p id="now-playing-label" class="text-sm font-bold uppercase tracking-widest mb-2 flex items-center justify-center gap-2 transition-colors duration-500" style="color: var(--channel-color)">
                    <span class="inline-block w-2 h-2 rounded-full animate-pulse" style="background-color: var(--channel-color)"></span>
                    <span id="station-name-display">ערוץ רוק קלאסי</span>
                </p>
                <h2 id="song-title" class="text-3xl md:text-4xl font-bold mb-2 truncate px-4">מוכן לשידור</h2>
                <h3 id="artist-name" class="text-xl md:text-2xl text-gray-400 truncate px-4">לחץ פליי להאזנה</h3>
            </div>

            <!-- Equalizer Animation -->
            <div id="equalizer" class="h-8 mb-6 flex items-end justify-center opacity-50">
                <div class="bar h-2"></div>
                <div class="bar h-4"></div>
                <div class="bar h-3"></div>
                <div class="bar h-5"></div>
                <div class="bar h-2"></div>
            </div>

            <!-- Controls -->
            <div class="flex items-center justify-center gap-6 md:gap-10 w-full max-w-md">
                <div class="flex flex-col items-center">
                    <span class="text-xs mb-2 font-bold animate-pulse tracking-widest px-3 py-1 rounded-full border transition-colors duration-500" id="live-badge" style="color: var(--channel-color); border-color: var(--channel-color); background-color: rgba(0,0,0,0.5);">שידור חי</span>
                    <button id="play-pause-btn" class="w-20 h-20 flex items-center justify-center rounded-full text-white text-3xl transition-all transform hover:scale-105 focus:outline-none" style="background-color: var(--channel-color); box-shadow: 0 0 20px var(--channel-glow);">
                        <i class="fas fa-play ml-2"></i>
                    </button>
                </div>
            </div>

            <!-- Volume Control -->
            <div class="flex items-center gap-4 mt-6 w-full max-w-xs">
                <i class="fas fa-volume-down text-gray-400"></i>
                <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.7" class="w-full h-1 bg-gray-600 rounded-lg appearance-none cursor-pointer">
                <i class="fas fa-volume-up text-gray-400"></i>
            </div>
            
            <!-- זיהוי שיר (Shazam Style) -->
            <div class="mt-6 flex flex-col items-center w-full min-h-[80px]">
                <button id="identify-song-btn" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-500 text-white px-5 py-2.5 rounded-full text-sm font-bold transition-all shadow-[0_0_10px_rgba(37,99,235,0.4)] focus:outline-none">
                    <i class="fas fa-bolt"></i> מה מתנגן עכשיו?
                </button>
                <div id="identify-result" class="mt-3 hidden text-center bg-black bg-opacity-80 px-6 py-3 rounded-xl border border-blue-500 shadow-[0_0_15px_rgba(37,99,235,0.2)] transform transition-all duration-300 scale-95 opacity-0">
                    <p class="text-xs text-blue-400 mb-1 tracking-wider uppercase">זוהה בהצלחה בערוץ</p>
                    <p id="identified-track" class="font-bold text-white text-base md:text-lg">טוען...</p>
                    <a href="#" class="text-xs text-gray-400 hover:text-white mt-2 inline-block underline">חפש ב-YouTube</a>
                </div>
            </div>

            <audio id="audio-player"></audio>
        </section>

        <!-- Playlist Section (Right/Bottom) -->
        <section class="w-full md:w-1/2 lg:w-1/3 flex flex-col bg-black bg-opacity-40 rounded-2xl border border-white border-opacity-10 backdrop-blur-sm overflow-hidden flex-grow md:flex-grow-0 h-full">
            <div class="p-4 border-b border-white border-opacity-10 flex justify-between items-center bg-black bg-opacity-30">
                <h3 class="font-rock text-lg tracking-wider">לוח שידורים</h3>
                <span class="text-xs bg-gray-600 text-white px-2 py-1 rounded font-bold">היום</span>
            </div>
            
            <div class="overflow-y-auto playlist-scroll p-2 flex-grow" id="playlist-container">
                <!-- Schedule items will be injected here by JS -->
            </div>
        </section>

    </main>

    <footer class="bg-black py-6 border-t border-white border-opacity-10 relative z-10 text-center text-sm text-gray-400 mt-auto">
        <div class="container mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <p>&copy; 2026 רשת רדיו Rock Universe. כל הזכויות שמורות.</p>
            <div class="flex gap-4 md:gap-6 text-xs md:text-sm">
                <a href="#" class="hover:text-white transition-colors">תקנון האתר</a>
                <a href="#" class="hover:text-white transition-colors">מדיניות פרטיות</a>
                <a href="#" class="hover:text-white transition-colors">הצהרת נגישות</a>
            </div>
        </div>
    </footer>

    <!-- Background Elements -->
    <div class="fixed top-0 left-0 w-full h-full pointer-events-none z-0 overflow-hidden">
        <div id="bg-glow-1" class="absolute top-[-10%] right-[-5%] w-[40vw] h-[40vw] rounded-full mix-blend-screen filter blur-[100px] opacity-20 transition-colors duration-1000" style="background-color: var(--channel-color);"></div>
        <div id="bg-glow-2" class="absolute bottom-[-10%] left-[-10%] w-[50vw] h-[50vw] bg-blue-900 rounded-full mix-blend-screen filter blur-[120px] opacity-20"></div>
        <div class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCI+PHBhdGggZD0iTTAgMGg0MHY0MEgwVjB6bTIwIDIwaDIwdjIwSDIwVjIwek0wIDIwaDIwdjIwSDBWMjB6bTIwIDBWMGgyMHYyMEgyMHoiIGZpbGw9IiNmZmYiIGZpbGwtb3BhY2l0eT0iMC4wMiIgZmlsbC1ydWxlPSJldmVub2RkIi8+PC9zdmc+')] opacity-30"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // Database of Channels
            const channels = {
                classic: {
                    id: 'classic',
                    name: 'רוק קלאסי',
                    color: '#e63946', // Red
                    glow: 'rgba(230,57,70,0.4)',
                    icon: 'fa-guitar',
                    image: 'https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=60',
                    streamUrl: 'https://stream.radioparadise.com/rock-128',
                    currentShow: "רוק בעבודה",
                    currentHost: "דני אלמוג",
                    songs: [
                        "Pink Floyd - Comfortably Numb", "Queen - Bohemian Rhapsody", 
                        "The Rolling Stones - Paint It, Black", "AC/DC - Back In Black", 
                        "Deep Purple - Smoke On The Water", "Guns N' Roses - Sweet Child O' Mine"
                    ],
                    schedule: [
                        { time: "06:00 - 10:00", show: "בוקר של רוק", host: "אבי כהן" },
                        { time: "10:00 - 14:00", show: "רוק בעבודה", host: "דני אלמוג", isLive: true },
                        { time: "14:00 - 18:00", show: "אגדות הרוק", host: "יואב בן ארי" },
                        { time: "18:00 - 00:00", show: "לילה קלאסי", host: "רוני שחר" }
                    ]
                },
                alt: {
                    id: 'alt',
                    name: 'אלטרנטיבי וגראנג\'',
                    color: '#2a9d8f', // Teal
                    glow: 'rgba(42,157,143,0.4)',
                    icon: 'fa-record-vinyl',
                    image: 'https://images.unsplash.com/photo-1498038432885-c6f3f1b912ee?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=60',
                    streamUrl: 'https://stream.radioparadise.com/mp3-128',
                    currentShow: "שנות התשעים",
                    currentHost: "מיכל גרין",
                    songs: [
                        "Nirvana - Smells Like Teen Spirit", "Pearl Jam - Alive", 
                        "Radiohead - Creep", "Soundgarden - Black Hole Sun", 
                        "The Smashing Pumpkins - 1979", "Alice In Chains - Man in the Box"
                    ],
                    schedule: [
                        { time: "07:00 - 12:00", show: "קפה וגראנג'", host: "תומר גל" },
                        { time: "12:00 - 16:00", show: "שנות התשעים", host: "מיכל גרין", isLive: true },
                        { time: "16:00 - 20:00", show: "אינדי ודיסטורשן", host: "אדם לוי" },
                        { time: "20:00 - 00:00", show: "אלטרנטיב ניישן", host: "דנה כץ" }
                    ]
                },
                metal: {
                    id: 'metal',
                    name: 'הבי מטאל',
                    color: '#9d4edd', // Purple
                    glow: 'rgba(157,78,221,0.4)',
                    icon: 'fa-bolt',
                    image: 'https://images.unsplash.com/photo-1598387181032-a3103a2db5b3?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=60',
                    streamUrl: 'https://stream.radioparadise.com/mellow-128', // Placeholder stream
                    currentShow: "כבד על הבוקר",
                    currentHost: "זאב מור",
                    songs: [
                        "Metallica - Master of Puppets", "Iron Maiden - The Trooper", 
                        "Black Sabbath - Paranoid", "Megadeth - Symphony of Destruction", 
                        "Judas Priest - Painkiller", "Slayer - Raining Blood"
                    ],
                    schedule: [
                        { time: "08:00 - 13:00", show: "כבד על הבוקר", host: "זאב מור", isLive: true },
                        { time: "13:00 - 18:00", show: "מטאל טהור", host: "גיא בר" },
                        { time: "18:00 - 22:00", show: "אקסטרים ריף", host: "שרון כהן" },
                        { time: "22:00 - 02:00", show: "לילה אפל", host: "עידן פלג" }
                    ]
                },
                indie: {
                    id: 'indie',
                    name: 'אינדי ופולק',
                    color: '#f4a261', // Orange/Yellow
                    glow: 'rgba(244,162,97,0.4)',
                    icon: 'fa-leaf',
                    image: 'https://images.unsplash.com/photo-1460036521480-a5bb373d5c64?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=60',
                    streamUrl: 'https://stream.radioparadise.com/world-128', // Placeholder stream
                    currentShow: "אקוסטי עכשיו",
                    currentHost: "נטע שיר",
                    songs: [
                        "Arctic Monkeys - Do I Wanna Know?", "The Strokes - Reptilia", 
                        "Bon Iver - Holocene", "Fleet Foxes - White Winter Hymnal", 
                        "Mumford & Sons - I Will Wait", "Florence + The Machine - Dog Days"
                    ],
                    schedule: [
                        { time: "06:00 - 11:00", show: "בוקר רגוע", host: "טל שדה" },
                        { time: "11:00 - 16:00", show: "אקוסטי עכשיו", host: "נטע שיר", isLive: true },
                        { time: "16:00 - 20:00", show: "גילויים חדשים", host: "אורן זיו" },
                        { time: "20:00 - 00:00", show: "פולק וחלומות", host: "שירה פלד" }
                    ]
                }
            };

            let currentChannel = channels.classic;
            let isPlaying = false;

            // DOM Elements
            const audioPlayer = document.getElementById('audio-player');
            const playPauseBtn = document.getElementById('play-pause-btn');
            const volumeSlider = document.getElementById('volume-slider');
            const songTitleEl = document.getElementById('song-title');
            const artistNameEl = document.getElementById('artist-name');
            const albumArtEl = document.getElementById('album-art');
            const equalizer = document.getElementById('equalizer');
            const playlistContainer = document.getElementById('playlist-container');
            const stationNameDisplay = document.getElementById('station-name-display');
            const channelSelector = document.getElementById('channel-selector');
            
            // Initialize Channels Menu
            function renderChannelMenu() {
                channelSelector.innerHTML = '';
                Object.values(channels).forEach(channel => {
                    const btn = document.createElement('button');
                    const isActive = currentChannel.id === channel.id;
                    
                    btn.className = `flex items-center gap-2 px-4 py-2 rounded-full font-bold text-sm transition-all duration-300 focus:outline-none ${isActive ? 'text-black' : 'text-gray-300 bg-gray-800 hover:bg-gray-700 border border-transparent'}`;
                    if (isActive) {
                        btn.style.backgroundColor = channel.color;
                        btn.style.boxShadow = `0 0 10px ${channel.glow}`;
                    }
                    
                    btn.innerHTML = `<i class="fas ${channel.icon}"></i> ${channel.name}`;
                    btn.onclick = () => switchChannel(channel.id);
                    channelSelector.appendChild(btn);
                });
            }

            function switchChannel(channelId) {
                if (currentChannel.id === channelId) return; // Already on this channel
                
                const wasPlaying = isPlaying;
                if (wasPlaying) pauseStream();
                
                currentChannel = channels[channelId];
                
                // Update UI Colors
                document.documentElement.style.setProperty('--channel-color', currentChannel.color);
                document.documentElement.style.setProperty('--channel-glow', currentChannel.glow);
                
                // Fade out/in album art
                albumArtEl.style.opacity = 0;
                setTimeout(() => {
                    albumArtEl.src = currentChannel.image;
                    albumArtEl.style.opacity = 1;
                }, 300);

                // Update Text
                stationNameDisplay.textContent = `ערוץ ${currentChannel.name}`;
                songTitleEl.textContent = "מוכן לשידור";
                artistNameEl.textContent = "לחץ פליי להאזנה";
                
                renderChannelMenu();
                renderSchedule();
                
                // Auto play if it was playing before switching
                if (wasPlaying) {
                    setTimeout(playStream, 500); // Small delay for effect
                }
            }

            function renderSchedule() {
                playlistContainer.innerHTML = '';
                currentChannel.schedule.forEach((slot) => {
                    const item = document.createElement('div');
                    item.className = `flex flex-col p-3 rounded-lg border-b border-white border-opacity-5 mb-2 transition-colors
                                      ${slot.isLive ? 'bg-white bg-opacity-10 border-r-4' : 'hover:bg-white hover:bg-opacity-5'}`;
                    if(slot.isLive) { item.style.borderRightColor = currentChannel.color; }
                    
                    item.innerHTML = `
                        <div class="flex justify-between items-center w-full mb-1">
                            <h4 class="text-sm font-bold text-white ${slot.isLive ? '' : ''}" ${slot.isLive ? `style="color: ${currentChannel.color}"` : ''}>${slot.show}</h4>
                            <span class="text-xs text-gray-400 bg-black px-2 py-1 rounded tracking-wider">${slot.time}</span>
                        </div>
                        <p class="text-xs text-gray-400">שדרן/ית: ${slot.host}</p>
                        ${slot.isLive ? `<div class="text-xs mt-2 animate-pulse flex items-center gap-1" style="color: ${currentChannel.color}"><i class="fas fa-broadcast-tower"></i> משודר כעת</div>` : ''}
                    `;
                    playlistContainer.appendChild(item);
                });
            }

            function playStream() {
                isPlaying = true;
                playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
                albumArtEl.classList.add('spin');
                equalizer.classList.add('playing');
                
                if (!audioPlayer.src || audioPlayer.src !== currentChannel.streamUrl) {
                    audioPlayer.src = currentChannel.streamUrl;
                }
                
                songTitleEl.textContent = `שידור חי: ${currentChannel.currentShow}`;
                artistNameEl.textContent = `עם ${currentChannel.currentHost}`;
                
                audioPlayer.play().catch(e => {
                    console.log("Audio play blocked by browser", e);
                    pauseStream();
                });
            }

            function pauseStream() {
                isPlaying = false;
                playPauseBtn.innerHTML = '<i class="fas fa-play ml-2"></i>';
                albumArtEl.classList.remove('spin');
                equalizer.classList.remove('playing');
                
                audioPlayer.pause();
                audioPlayer.src = ''; 
                
                songTitleEl.textContent = "השידור מושהה";
                artistNameEl.textContent = "לחץ פליי כדי להצטרף";
            }

            playPauseBtn.addEventListener('click', () => {
                isPlaying ? pauseStream() : playStream();
            });

            volumeSlider.addEventListener('input', (e) => {
                audioPlayer.volume = e.target.value;
            });

            const identifyBtn = document.getElementById('identify-song-btn');
            const identifyResult = document.getElementById('identify-result');
            const identifiedTrack = document.getElementById('identified-track');

            identifyBtn.addEventListener('click', () => {
                if (!isPlaying) {
                    const originalHTML = identifyBtn.innerHTML;
                    identifyBtn.innerHTML = '<i class="fas fa-exclamation-triangle"></i> הפעל שידור תחילה';
                    identifyBtn.classList.replace('bg-blue-600', 'bg-red-600');
                    identifyBtn.classList.replace('hover:bg-blue-500', 'hover:bg-red-500');
                    
                    setTimeout(() => {
                        identifyBtn.innerHTML = originalHTML;
                        identifyBtn.classList.replace('bg-red-600', 'bg-blue-600');
                        identifyBtn.classList.replace('hover:bg-red-500', 'hover:bg-blue-500');
                    }, 2500);
                    return;
                }

                identifyBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> מאזין לערוץ...';
                identifyBtn.classList.add('listening-animation');
                
                identifyResult.classList.add('opacity-0', 'scale-95');
                setTimeout(() => identifyResult.classList.add('hidden'), 300);

                setTimeout(() => {
                    identifyBtn.classList.remove('listening-animation');
                    identifyBtn.innerHTML = '<i class="fas fa-bolt"></i> מה מתנגן עכשיו?';
                    
                    // Pull a random song from the CURRENT active channel
                    const songs = currentChannel.songs;
                    const randomSong = songs[Math.floor(Math.random() * songs.length)];
                    identifiedTrack.textContent = randomSong;
                    
                    identifyResult.classList.remove('hidden');
                    setTimeout(() => {
                        identifyResult.classList.remove('opacity-0', 'scale-95');
                        identifyResult.classList.add('opacity-100', 'scale-100');
                    }, 10);
                }, 3500); 
            });

            // Init
            audioPlayer.volume = volumeSlider.value;
            renderChannelMenu();
            renderSchedule();
        });
    </script>
</body>
</html>
